name: Pokémon Sleep Push Dispatcher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  dispatch-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Vercel Push Dispatch Endpoint
        run: |
          TARGET_URL="${{ vars.APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://hachidori-airlines-fap8.vercel.app"
          fi
          echo "Dispatching push to: ${TARGET_URL%/}/api/push"
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" --max-time 30 "${TARGET_URL%/}/api/push" || echo "failed")
          echo "HTTP Status: $HTTP_STATUS"
          cat response.json || true
          echo ""
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning ::Push dispatch returned HTTP $HTTP_STATUS"
          fi
