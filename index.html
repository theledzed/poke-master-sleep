<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SleepMaster" />
    <meta name="application-name" content="Pokémon Sleep Master" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Optimizador inteligente de equipos y gestor de Pokémon para Pokémon Sleep" />
    <!-- Cozy Nintendo Fonts: Fredoka (Headings/Display) & Nunito (Interface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Synchronous zero-latency atmospheric theme initializer (0ms before first paint) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sleep_master_weather_v1');
          var isAuto = localStorage.getItem('sleep_master_weather_auto_v1') !== 'false';
          var theme = saved;
          if (!theme || isAuto) {
            var h = new Date().getHours();
            theme = (h >= 6 && h < 12) ? 'morning' : (h >= 12 && h < 19) ? 'afternoon' : 'night';
          }
          document.documentElement.setAttribute('data-theme-weather', theme);
          var bgColors = {
            morning: '#0F3A5D',
            afternoon: '#1B1032',
            night: '#0A0D1E',
            rain: '#0A0D1E'
          };
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme && bgColors[theme]) {
            metaTheme.setAttribute('content', bgColors[theme]);
          }
        } catch (e) {}
      })();
    </script>
    <title>Pokémon Sleep Master - Optimizador de Equipos</title>
  </head>
  <body class="text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white" style="background-color: var(--bg-app-top);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
