<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mbPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="mbPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="mbWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="mbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#mbShadow)">
    <!-- Base Outer Ring -->
    <circle cx="50" cy="50" r="46" fill="#1e1b4b"/>
    <!-- Top Purple Shell -->
    <path d="M 4,50 A 46,46 0 0,1 96,50 Z" fill="url(#mbPurple)"/>
    <!-- Pink Round Lobes / Ears on Top -->
    <circle cx="28" cy="28" r="13" fill="url(#mbPink)"/>
    <circle cx="72" cy="28" r="13" fill="url(#mbPink)"/>
    <!-- White Iconic "M" on Center Top -->
    <path d="M 40,24 L 43,14 L 47,21 L 50,17 L 53,21 L 57,14 L 60,24 L 56,24 L 54,19 L 51,24 L 49,24 L 46,19 L 44,24 Z" fill="#ffffff"/>
    <!-- Bottom White Shell -->
    <path d="M 4,50 A 46,46 0 0,0 96,50 Z" fill="url(#mbWhite)"/>
    <!-- Glossy Highlight -->
    <path d="M 14,34 A 40,40 0 0,1 68,14 A 42,42 0 0,0 14,34 Z" fill="#ffffff" opacity="0.3"/>
    <!-- Center Band -->
    <rect x="4" y="46" width="92" height="8" fill="#1e1b4b"/>
    <!-- Button Rim -->
    <circle cx="50" cy="50" r="14" fill="#1e1b4b"/>
    <!-- Button Ring -->
    <circle cx="50" cy="50" r="10" fill="url(#mbWhite)"/>
    <!-- Button Core (Glowing Cyan) -->
    <circle cx="50" cy="50" r="6" fill="#67e8f9" stroke="#0284c7" stroke-width="1"/>
    <circle cx="48" cy="48" r="2" fill="#ffffff"/>
  </g>
</svg>
