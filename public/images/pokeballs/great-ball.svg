<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gbBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gbRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gbWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="gbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#gbShadow)">
    <!-- Base Outer Ring -->
    <circle cx="50" cy="50" r="46" fill="#1e293b"/>
    <!-- Top Blue Shell -->
    <path d="M 4,50 A 46,46 0 0,1 96,50 Z" fill="url(#gbBlue)"/>
    <!-- Red Aerodynamic Tabs -->
    <path d="M 16,36 Q 30,16 42,20 Q 32,38 20,46 Z" fill="url(#gbRed)"/>
    <path d="M 84,36 Q 70,16 58,20 Q 68,38 80,46 Z" fill="url(#gbRed)"/>
    <!-- Bottom White Shell -->
    <path d="M 4,50 A 46,46 0 0,0 96,50 Z" fill="url(#gbWhite)"/>
    <!-- Glossy Highlight -->
    <path d="M 14,34 A 40,40 0 0,1 68,14 A 42,42 0 0,0 14,34 Z" fill="#ffffff" opacity="0.35"/>
    <!-- Center Band -->
    <rect x="4" y="46" width="92" height="8" fill="#1e293b"/>
    <!-- Button Rim -->
    <circle cx="50" cy="50" r="14" fill="#1e293b"/>
    <!-- Button Ring -->
    <circle cx="50" cy="50" r="10" fill="url(#gbWhite)"/>
    <!-- Button Core -->
    <circle cx="50" cy="50" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="48" cy="48" r="2" fill="#ffffff"/>
  </g>
</svg>
