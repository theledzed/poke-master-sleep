<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pbGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="pbRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="50%" stop-color="#ee1515"/>
      <stop offset="100%" stop-color="#ba0a0a"/>
    </linearGradient>
    <linearGradient id="pbWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="pbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#pbShadow)">
    <!-- Base Outer Ring -->
    <circle cx="50" cy="50" r="46" fill="#1e293b"/>
    <!-- Top Red Shell -->
    <path d="M 4,50 A 46,46 0 0,1 96,50 Z" fill="url(#pbRed)"/>
    <!-- Bottom White Shell -->
    <path d="M 4,50 A 46,46 0 0,0 96,50 Z" fill="url(#pbWhite)"/>
    <!-- Glossy Highlight -->
    <path d="M 12,38 A 40,40 0 0,1 70,14 A 42,42 0 0,0 12,38 Z" fill="#ffffff" opacity="0.35"/>
    <!-- Center Band -->
    <rect x="4" y="46" width="92" height="8" fill="#1e293b"/>
    <!-- Button Rim -->
    <circle cx="50" cy="50" r="14" fill="#1e293b"/>
    <!-- Button Ring -->
    <circle cx="50" cy="50" r="10" fill="url(#pbWhite)"/>
    <!-- Button Core -->
    <circle cx="50" cy="50" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="48" cy="48" r="2" fill="#ffffff"/>
  </g>
</svg>
